apiVersion: v1
kind: ConfigMap
metadata:
  name: ruvamco-config
  namespace: ruvamco
  labels:
    app.kubernetes.io/name: ruvamco
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  AWS_REGION: "us-east-1"
  DYNAMODB_TABLE: "ruvamco-instances"
  SQS_QUEUE_NAME: "ruvamco-tasks"
  S3_CONTEXT_BUCKET: "ruvamco-context"
  XDS_PORT: "18000"
  BROKER_PORT: "8080"
  CACHE_TTL_SECONDS: "5"
  PROMETHEUS_ENDPOINT: "http://prometheus.monitoring:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
