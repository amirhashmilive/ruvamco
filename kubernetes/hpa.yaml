---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ruvamco-broker-hpa
  namespace: ruvamco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ruvamco-broker
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ruvamco-control-plane-hpa
  namespace: ruvamco
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ruvamco-control-plane
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
